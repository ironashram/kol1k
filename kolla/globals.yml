---
# Kolla Ansible Configuration
prechecks_enable_host_os_checks: "no"

# --- Networking ---
kolla_base_distro: "ubuntu"
network_interface: "eth0"
neutron_external_interface: "eth1"
tunnel_interface: "eth2"

kolla_internal_vip_address: "10.128.0.2"
kolla_external_vip_address: "10.128.0.3"

# --- Enable/Disable Components ---
enable_openstack_core: "no"
enable_cinder: "no"
enable_swift: "no"
enable_horizon: "no"
enable_fluentd: "no"
enable_heat: "no"
enable_mariadb: "yes"
enable_rabbitmq: "yes"
enable_memcached: "yes"
enable_neutron: "yes"
enable_glance: "yes"
enable_nova: "yes"
enable_keystone: "yes"
enable_haproxy: "yes"
enable_skyline: "no"
enable_prometheus: "yes"
enable_prometheus_cadvisor: "no"
enable_prometheus_alertmanager: "no"
enable_prometheus_openstack_exporter: "no"
enable_prometheus_haproxy_exporter: "no"
enable_prometheus_memcached_exporter: "no"
enable_prometheus_mysqld_exporter: "no"
enable_prometheus_rabbitmq_exporter: "no"
enable_prometheus_blackbox_exporter: "no"

# --- Service Configuration ---
nova_compute_virt_type: "qemu"
nova_libvirt_cpu_mode: "host-model"
neutron_plugin_agent: "openvswitch"
enable_neutron_provider_networks: "yes"

# --- OpenStack Release ---
openstack_release: "2025.2"

# -- TLS Configuration ---
kolla_enable_tls_internal: "no"
kolla_enable_tls_backend: "no"
kolla_enable_tls_external: "no"
kolla_copy_ca_into_containers: "no"
kolla_external_fqdn: "10.128.0.3"
