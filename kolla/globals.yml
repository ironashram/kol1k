---
# Kolla Ansible Configuration for Synology VMM
# Base OS: Ubuntu 24.04 (Noble)
prechecks_enable_host_os_checks: "no"

# --- Networking ---
kolla_base_distro: "ubuntu"
# Ensure these match the interface names inside the VMs (usually eth0/eth1 or ens3/ens4)
network_interface: "eth0" # Management/API/Tunnel interface
neutron_external_interface: "eth1" # External provider interface
tunnel_interface: "eth2" # VXLAN/GRE tunnel interface

# VIP for High Availability (Must be a free IP on your management network)
kolla_internal_vip_address: "10.128.0.2"
kolla_external_vip_address: "10.128.0.3"

# --- Enable/Disable Components ---
enable_neutron: "yes"
enable_glance: "yes"
enable_nova: "yes"
enable_keystone: "yes"
enable_horizon: "yes"
enable_haproxy: "yes"

# --- Storage Configuration ---
# We are disabling Cinder (Shared Block Storage) as requested.
enable_cinder: "no"
enable_swift: "no"

# Nova will use local disk on compute nodes for instances (default behavior when Cinder is off).
# Ensure /var/lib/nova has enough space on compute nodes.

# --- Virtualization Type ---
# Synology VMM uses KVM.
# If your Synology supports nested virtualization and it's enabled, use 'kvm'.
# If not, or if you experience stability issues, use 'qemu' (slower, software emulation).
nova_compute_virt_type: "qemu"
nova_libvirt_cpu_mode: "host-model"

# --- Neutron Plugin ---
neutron_plugin_agent: "ovn"

# --- Dependencies ---
enable_mariadb: "yes"
enable_rabbitmq: "yes"
enable_memcached: "yes"

# --- Neutron Provider Networks ---
enable_neutron_provider_networks: "yes"
# --- Miscellaneous ---
# OpenStack release version (ensure this matches the kolla-ansible version you install)
openstack_release: "2025.2"

# TLS
kolla_enable_tls_internal: "no"
kolla_enable_tls_backend: "no"
kolla_copy_ca_into_containers: "no"

kolla_enable_tls_external: "yes"
kolla_external_fqdn: "openstack.{{ domain_name }}"
kolla_external_fqdn_cert: "/etc/kolla/certificates/openstack.pem"
